name: Build Radhe Radhe Developer EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path Transport-main/requirements.txt) {
            pip install -r Transport-main/requirements.txt
          }
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "RadheRadheDeveloper" Transport-main/main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RadheRadheDeveloper-Snapshot-Windows
          path: dist/RadheRadheDeveloper.exe
