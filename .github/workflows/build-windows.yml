name: Build Radhe Radhe Developer EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Test database backup and restore safely
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Download Gujarati font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fonts | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansgujarati/NotoSansGujarati%5Bwdth%2Cwght%5D.ttf" -OutFile "fonts/NotoSansGujarati.ttf"
          if ((Get-Item "fonts/NotoSansGujarati.ttf").Length -lt 50000) { throw "Gujarati font download failed or file is invalid." }
          python -m pip install fonttools
          python -c "from fontTools.ttLib import TTFont; f=TTFont('fonts/NotoSansGujarati.ttf'); print('Gujarati font tables:', sorted(f.keys())); assert 'cmap' in f and 'glyf' in f"

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --add-data "fonts/NotoSansGujarati.ttf;fonts" --name "RadheRadheDeveloper" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: RadheRadheDeveloper-Windows
          path: dist/RadheRadheDeveloper.exe
